name: Build PDF

# Compiles main.tex with XeLaTeX (full TeX Live) on every push and pull request.
# The PDF is kept with each run (Actions -> the run -> Artifacts). For the
# default branch it is also published as the release "pdf", so the latest
# version can always be downloaded from:
#   https://github.com/<owner>/<repo>/releases/download/pdf/thesis.pdf
# GitHub Pages is not affected: it keeps publishing docs/ as before.

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'tests/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v5

      - name: Compile main.tex with XeLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_xelatex: true

      - name: Name the PDF
        run: cp main.pdf thesis.pdf

      - name: Keep the PDF with this run
        uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: thesis.pdf

      - name: Publish the PDF as the release "pdf"
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pdf --cleanup-tag --yes || true
          gh release create pdf thesis.pdf --target "$GITHUB_SHA" \
            --title "PDF (latest build)" \
            --notes "thesis.pdf compiled from main.tex at commit $GITHUB_SHA."
